version: 2

models:
  - name: customers
    description: >
      This table serves as the single source of truth for customer information, combining basic customer details with 
      derived metrics from their order history. It provides a comprehensive view of customer behavior and value, 
      including order frequency and monetary metrics.
    meta:
      owner: "analytics_team"
      contains_pii: true
      update_frequency: "daily"
      business_key: "customer_id"

    columns:
      - name: customer_id
        description: >
          Primary key and unique identifier for each customer. This ID is consistent across all customer touchpoints 
          and remains unchanged throughout the customer lifecycle.
        tests:
          - unique
          - not_null
        meta:
          is_primary_key: true

      - name: first_name
        description: >
          Customer's first name. This is personally identifiable information (PII) and should be handled according 
          to data privacy guidelines.
        tests:
          - not_null
        meta:
          is_pii: true

      - name: last_name
        description: >
          Customer's last name. This is personally identifiable information (PII) and should be handled according 
          to data privacy guidelines.
        tests:
          - not_null
        meta:
          is_pii: true

      - name: first_order
        description: >
          Timestamp (UTC) of the customer's first order. This helps track customer longevity and is used for 
          cohort analysis. Can be NULL if customer has not placed any orders.
        meta:
          time_grainularity: "timestamp"

      - name: most_recent_order
        description: >
          Timestamp (UTC) of the customer's most recent order. Used to identify active customers and track 
          purchase frequency patterns. Can be NULL if customer has not placed any orders.
        meta:
          time_grainularity: "timestamp"

      - name: number_of_orders
        description: >
          Total count of orders placed by the customer. This metric helps identify high-frequency customers 
          and is used in customer segmentation. Will be NULL if customer has not placed any orders.
        meta:
          metric_type: "count"

      - name: total_order_amount
        description: >
          Total monetary value (AUD) of all orders placed by the customer. This represents the customer's 
          lifetime value and is a key metric for customer segmentation and marketing strategies.
        tests:
          - not_null  # This should pass because we use COALESCE in the SQL
        meta:
          metric_type: "currency"
          currency: "AUD"

data_tests:
  - name: assert_customer_dates_are_valid
    description: >
      Ensures that most_recent_order is not before first_order for any customer.
      The test fails if there are any records where most_recent_order < first_order.

  - name: assert_customer_metrics_are_valid
    description: >
      Ensures that number_of_orders and total_order_amount are non-negative.
      The test fails if there are any records with negative values.


