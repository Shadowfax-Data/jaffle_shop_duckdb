version: 2

models:
  - name: customers
    description: This table has basic information about a customer, as well as some derived facts based on a customer's orders and payment history. It serves as the single source of truth for customer information.

    columns:
      - name: customer_id
        description: This is a unique identifier for a customer
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id

      - name: first_name
        description: Customer's first name. PII.
        tests:
          - not_null

      - name: last_name
        description: Customer's last name. PII.
        tests:
          - not_null

      - name: first_order
        description: Date (UTC) of a customer's first order. NULL if customer has no orders.
        tests:
          - dbt_utils.accepted_range:
              min_value: "cast('2018-01-01' as date)"
              max_value: "cast({{ current_timestamp() }} as date)"
              where: "first_order is not null"

      - name: most_recent_order
        description: Date (UTC) of a customer's most recent order. NULL if customer has no orders.
        tests:
          - dbt_utils.accepted_range:
              min_value: "cast('2018-01-01' as date)"
              max_value: "cast({{ current_timestamp() }} as date)"
              where: "most_recent_order is not null"

      - name: number_of_orders
        description: Count of the number of orders a customer has placed
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              where: "number_of_orders is not null"

      - name: customer_lifetime_value
        description: Total value (AUD) of a customer's orders. NULL if customer has no orders.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              where: "customer_lifetime_value is not null"




