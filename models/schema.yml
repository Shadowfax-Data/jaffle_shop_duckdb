version: 2

models:
  - name: customers
    description: This table has basic information about a customer, as well as some derived facts based on a customer's orders. It combines data from staging tables to create a comprehensive customer view.

    columns:
      - name: customer_id
        description: This is a unique identifier for a customer
        tests:
          - unique
          - not_null

      - name: first_name
        description: Customer's first name. PII.
        tests:
          - not_null

      - name: last_name
        description: Customer's last name. PII.
        tests:
          - not_null

      - name: first_order
        description: Date (UTC) of a customer's first order. Null if customer has no orders.

      - name: most_recent_order
        description: Date (UTC) of a customer's most recent order. Null if customer has no orders.

      - name: number_of_orders
        description: Count of the number of orders a customer has placed
        tests:
          - not_null

      - name: customer_lifetime_value
        description: Total value (AUD) of all orders placed by the customer
        tests:
          - not_null


