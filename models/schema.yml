version: 2

models:
  - name: customers
    description: >
      This table represents the single source of truth for all customer-related data.
      It combines customer information from stg_customers with order history and payment data,
      providing a comprehensive view of customer behavior and value.
      The table includes basic customer details, order metrics, and financial metrics.

    columns:
      - name: customer_id
        description: This is a unique identifier for a customer
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id

      - name: first_name
        description: Customer's first name. PII.
        tests:
          - not_null

      - name: last_name
        description: Customer's last name. PII.
        tests:
          - not_null

      - name: first_order
        description: Date (UTC) of a customer's first order. Null if customer has no orders.

      - name: most_recent_order
        description: Date (UTC) of a customer's most recent order. Null if customer has no orders.

      - name: number_of_orders
        description: Count of the number of orders a customer has placed. Defaults to 0 for customers with no orders.
        tests:
          - not_null

      - name: customer_lifetime_value
        description: Total value (AUD) of all orders placed by the customer. Defaults to 0 for customers with no orders.
        tests:
          - not_null


