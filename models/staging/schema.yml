version: 2

models:
  - name: stg_customers
    description: Staging layer for customer data. Contains basic customer information from raw_customers.
    columns:
      - name: customer_id
        description: Unique identifier for each customer. Primary key of the customers table.
        tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name
        tests:
          - not_null
      - name: last_name
        description: Customer's last name
        tests:
          - not_null

  - name: stg_orders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: status
        tests:
          - accepted_values:
              values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']

  - name: stg_payments
    columns:
      - name: payment_id
        tests:
          - unique
          - not_null
      - name: payment_method
        tests:
          - accepted_values:
              values: ['credit_card', 'coupon', 'bank_transfer', 'gift_card']
